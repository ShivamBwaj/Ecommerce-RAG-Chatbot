name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install-and-smoke-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Import smoke-check each app package
        run: |
          uv run --package api python -c "import api.app"
          uv run --package chatbot-ui python -c "import chatbot_ui.app"
          uv run --package items-mcp-server python -c "import items_mcp_server.main"
          uv run --package reviews-mcp-server python -c "import reviews_mcp_server.main"

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, chatbot-ui, items_mcp_server, reviews_mcp_server]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.app }} image
        run: docker build -f apps/${{ matrix.app }}/Dockerfile -t handson-${{ matrix.app }}:ci .
