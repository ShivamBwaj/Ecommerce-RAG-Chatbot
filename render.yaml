# Deployed via `render services create` (CLI) rather than the dashboard Blueprint
# flow, because the CLI's service-create command has no dockerfilePath/dockerContext
# flags (those are Blueprint-only), and this repo's Dockerfiles need a build context
# at the repo root while living in apps/*/Dockerfile. Native Python runtime + uv
# sidesteps that gap entirely. This file documents the equivalent Blueprint shape;
# the live services' actual config is the source of truth (see Render dashboard).

databases:
  - name: handson-postgres
    plan: free
    databaseName: langgraph_db
    user: langgraph_user

services:
  - type: web
    name: handson-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: "pip install uv && uv sync --frozen --no-dev --package api"
    startCommand: "cd apps/api/src && uv run uvicorn api.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: POSTGRES_DSN
        fromDatabase:
          name: handson-postgres
          property: connectionString
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        sync: false
      - key: EMBEDDING_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_ENDPOINT
        value: https://api.smith.langchain.com
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: rag-tracing

  - type: web
    name: handson-streamlit
    runtime: python
    plan: free
    rootDir: .
    buildCommand: "pip install uv && uv sync --frozen --no-dev --package chatbot-ui"
    startCommand: "cd apps/chatbot-ui/src && uv run streamlit run chatbot_ui/app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: API_URL
        value: https://handson-api.onrender.com
